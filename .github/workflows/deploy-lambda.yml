name: Deploy Lambda Function

on:
  push:
    branches: [main]
    paths:
      - 'lambda/**'
  workflow_dispatch:  # Manual trigger option

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # Step 2: Configure AWS credentials
      - name: 🔐 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # Step 3: Package Lambda function
      - name: 📦 Package Lambda function
        run: |
          cd lambda
          zip -r function.zip index.mjs

      # Step 4: Deploy to AWS Lambda
      - name: 🚀 Deploy to Lambda
        run: |
          cd lambda
          aws lambda update-function-code \
            --function-name ContactFormHandler \
            --region us-east-1 \
            --zip-file fileb://function.zip

      # Step 5: Verify deployment
      - name: ✅ Verify deployment
        run: |
          aws lambda get-function \
            --function-name ContactFormHandler \
            --region us-east-1 \
            --query 'Configuration.[FunctionName,State,LastUpdateStatus,LastModified]' \
            --output table

      # Step 6: Summary
      - name: 📊 Deployment Summary
        run: |
          echo "✅ Lambda deployment completed successfully!"
          echo "📧 Function: ContactFormHandler"
          echo "📍 Region: us-east-1"
          echo "✉️  Emails now sent from: noreply@gjphotos.com"
